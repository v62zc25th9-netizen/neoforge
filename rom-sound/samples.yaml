# ADPCM-A samples for the NeoForge V ROM test.
#
# vromtool.py reads this, encodes each WAV to ADPCM-A, packs it into the V ROM
# and emits the byte offsets as assembler .equ defines for the sound driver.
#
# assets/chirp.wav is generated by sample.py - no audio file is committed to
# this repository. See sample.py for why.

- adpcm_a:
    name: chirp
    uri: file://assets/chirp.wav
